services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mausam-mitra-postgres
    restart: unless-stopped
    ports:
      # Host 5433 avoids conflict with a local Windows PostgreSQL on 127.0.0.1:5432
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mausam_mitra}
      POSTGRES_USER: ${POSTGRES_USER:-mausam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mausam_dev_password}
    volumes:
      - mausam_mitra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mausam_mitra_pgdata:
